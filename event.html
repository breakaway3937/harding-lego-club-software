<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event results · LEGO Club</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="event">
<header class="top"><div class="wrap">
  <a class="brand" href="./"><img src="assets/lego-club-logo.png" alt="LEGO Club"><b id="site-title">LEGO Club</b></a>
  <nav><a class="btn ghost" href="./">All events</a><a class="btn live hidden" id="nav-live" href="#stream">Watch live</a></nav>
</div></header>

<main class="wrap">
  <section class="brick studs ev-head" id="ev-head"><h1>Loading…</h1></section>
  <div id="onfield"></div>
  <div id="stream" class="stream"></div>
  <div id="champion"></div>
  <div class="find"><input id="find" type="search" placeholder="Find your team: number or name" autocomplete="off" aria-label="Find your team"></div>
  <div class="sugg hidden" id="sugg"></div>
  <div id="teamcard"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panel"></div>
</main>

<footer><div class="wrap">Posted by the LEGO Club Game Server. <span id="updated"></span></div></footer>
<script src="site.js"></script>
</body>
</html>
